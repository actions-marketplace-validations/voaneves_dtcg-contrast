<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="{{THEME_LIGHT}}">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="{{THEME_DARK}}">
{{CANONICAL}}<link rel="icon" href="{{FAVICON}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
{{OG_EXTRA}}<meta name="twitter:card" content="{{OG_CARD}}">
<style>
:root{
{{VARS_LIGHT}}
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
{{VARS_DARK}}
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--text);font:1.0625rem/1.6 var(--sans)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.skip{position:absolute;left:1rem;top:-4rem;padding:.75rem 1rem;background:var(--btn-primary-fill);color:var(--btn-primary-text);border-radius:4px;font-weight:600;z-index:10}
.skip:focus{top:1rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{width:100%;max-width:60rem;margin:0 auto;padding:0 1rem}
.hero{padding:4rem 0 3rem;text-align:center}
.logo{display:block;margin:0 auto 1.5rem;width:7rem;height:7rem}
.logo-img{display:block;margin:0 auto 1.5rem;max-width:100%;height:auto}
h1{margin:0;font-size:clamp(2rem,6vw,3.25rem);line-height:1.1;letter-spacing:-.02em}
.tagline{margin:1rem auto 0;max-width:34rem;font-size:clamp(1.15rem,3.2vw,1.45rem);font-weight:700;line-height:1.35}
.lead{margin:1rem auto 0;max-width:36rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin:2rem 0 0;padding:0;list-style:none}
.btn{display:inline-flex;align-items:center;gap:.6rem;min-height:3rem;padding:0 1.25rem;border:1.5px solid transparent;border-radius:4px;font-weight:600;font-size:1rem;line-height:1;text-decoration:none;max-width:100%}
.btn-primary{background:var(--btn-primary-fill);color:var(--btn-primary-text)}
.btn-secondary{background:var(--btn-secondary-fill);color:var(--btn-secondary-text);border-color:var(--btn-secondary-border)}
.btn-command{font-family:var(--mono);font-weight:500;font-size:.9375rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--btn-primary-signal);flex:none}
.prompt{color:var(--btn-command-prompt)}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .15s ease}.btn:hover{transform:translateY(-1px)}}
section{padding:2.5rem 0}
h2{margin:0 0 1.25rem;font-size:1.5rem;line-height:1.25;letter-spacing:-.01em}
.features{display:grid;gap:1rem;margin:0;padding:0;list-style:none;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.features li{padding:1.25rem;border-radius:8px;background:var(--surface-alt)}
.features h3{margin:0 0 .35rem;font-size:1.0625rem}
.features p{margin:0}
.shot{margin:0}
.shot img{display:block;width:100%;height:auto;border-radius:8px;background:var(--surface-alt)}
.contact{text-align:center}
.contact p{margin:0 auto 1.25rem;max-width:34rem;color:var(--muted)}
a{color:var(--link);text-underline-offset:.2em}
a.btn{text-decoration:none}
footer{padding:2rem 0 3rem;color:var(--muted);font-size:.9375rem;text-align:center}
footer p{margin:0}
@media (max-width:30rem){.hero{padding-top:2.5rem}.btn{width:100%;justify-content:center}.actions{flex-direction:column;align-items:stretch}.actions li{display:flex}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">{{SKIP}}</a>
<main id="main">
  <div class="wrap">
    <section class="hero" aria-labelledby="name">
      {{LOGO}}
      <h1 id="name">{{NAME}}</h1>
      <p class="tagline">{{TAGLINE}}</p>
      <p class="lead">{{DESCRIPTION}}</p>
      <ul class="actions">
{{BUTTONS}}
      </ul>
    </section>
    <section aria-labelledby="features-title">
      <h2 id="features-title">{{FEATURES_TITLE}}</h2>
      <ul class="features">
{{FEATURES}}
      </ul>
    </section>
{{IMAGE}}    <section class="contact" aria-labelledby="hire-title">
      <h2 id="hire-title">{{HIRE_TITLE}}</h2>
      <p>{{HIRE_TEXT}}</p>
      <a class="btn btn-primary" href="{{HIRE_HREF}}"><span class="dot" aria-hidden="true"></span><span>{{HIRE_CTA}}</span><span aria-hidden="true">&rarr;</span></a>
    </section>
  </div>
</main>
<footer>
  <div class="wrap">
    <p>{{LICENSE_LINE}} <a href="{{GITHUB}}">GitHub</a></p>
  </div>
</footer>
</body>
</html>
