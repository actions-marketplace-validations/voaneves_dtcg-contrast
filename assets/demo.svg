<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="dtcg-contrast terminal demo showing WCAG 2.2, APCA, and OKLCH auto-fix suggestions">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
      .bold { font-weight: 700; }
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .border { stroke: #30363d; stroke-width: 1; fill: none; }
      .fg { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .cyan { fill: #58a6ff; }
      .green { fill: #3fb950; }
      .red { fill: #ff6b6b; }
      .yellow { fill: #d29922; }
    </style>
  </defs>

  <rect width="820" height="400" rx="12" class="bg" />
  <rect x="0.5" y="0.5" width="819" height="399" rx="12" class="border" />
  <path d="M1 12 A11 11 0 0 1 12 1 H808 A11 11 0 0 1 819 12 V38 H1 Z" class="bar" />
  <line x1="0" y1="38" x2="820" y2="38" stroke="#30363d" />

  <circle cx="22" cy="19" r="6" fill="#ff5f56" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="19" r="6" fill="#27c93f" />
  <text x="410" y="23" text-anchor="middle" class="mono muted">npx dtcg-contrast --config demo-fail.config.json</text>

  <text x="24" y="68" class="mono fg"><tspan class="muted">$ </tspan>npx dtcg-contrast --config examples/voaneves-brand/demo-fail.config.json</text>
  <text x="24" y="96" class="mono bold fg">dtcg-contrast <tspan class="red">FAIL</tspan> — 6/7 pairs passed across 2 theme(s)</text>

  <text x="24" y="130" class="mono bold cyan">Theme: light</text>

  <!-- Row 1: PASS -->
  <rect x="36" y="142" width="28" height="19" rx="3" fill="#f4ead4" stroke="#30363d" />
  <text x="50" y="156" text-anchor="middle" class="mono bold" fill="#0a0a0a">Aa</text>
  <text x="76" y="156" class="mono fg">color.text on color.surface</text>
  <text x="410" y="156" class="mono fg">16.56:1</text>
  <text x="485" y="156" class="mono muted">Lc +93.8</text>
  <text x="570" y="156" class="mono muted">AA >=4.5</text>
  <text x="655" y="156" class="mono bold green">PASS (AAA)</text>

  <!-- Row 2: FAIL + OKLCH Fix -->
  <rect x="28" y="168" width="764" height="54" rx="6" fill="#2a1215" stroke="#6e242a" />
  <rect x="36" y="176" width="28" height="19" rx="3" fill="#f4ead4" />
  <text x="50" y="190" text-anchor="middle" class="mono bold" fill="#f50000">Aa</text>
  <text x="76" y="190" class="mono fg">color.signal on color.surface</text>
  <text x="410" y="190" class="mono red bold">3.60:1</text>
  <text x="485" y="190" class="mono muted">Lc +54.6</text>
  <text x="570" y="190" class="mono muted">AA >=4.5</text>
  <text x="655" y="190" class="mono bold red">FAIL (AA-large)</text>

  <text x="76" y="213" class="mono yellow">↳ Suggested OKLCH fix:</text>
  <rect x="255" y="199" width="28" height="18" rx="3" fill="#f4ead4" />
  <text x="269" y="212" text-anchor="middle" class="mono bold" fill="#d70000">Aa</text>
  <text x="292" y="213" class="mono bold fg">#d70000 <tspan font-weight="400" class="muted">(oklch(0.552 0.227 29.2), ΔL -0.057) → </tspan><tspan class="green">4.52:1 / Lc 61.9</tspan></text>

  <!-- Row 3: PASS -->
  <rect x="36" y="232" width="28" height="19" rx="3" fill="#f4ead4" stroke="#30363d" />
  <text x="50" y="246" text-anchor="middle" class="mono bold" fill="#b80000">Aa</text>
  <text x="76" y="246" class="mono fg">color.signal-ink on color.surface</text>
  <text x="410" y="246" class="mono fg">5.78:1</text>
  <text x="485" y="246" class="mono muted">Lc +69.1</text>
  <text x="570" y="246" class="mono muted">AA >=4.5</text>
  <text x="655" y="246" class="mono bold green">PASS (AA)</text>

  <!-- Row 4: PASS -->
  <rect x="36" y="258" width="28" height="19" rx="3" fill="#f50000" stroke="#30363d" />
  <text x="50" y="272" text-anchor="middle" class="mono bold" fill="#0a0a0a">Aa</text>
  <text x="76" y="272" class="mono fg">color.text-on-signal on color.surface-signal</text>
  <text x="410" y="272" class="mono fg">4.60:1</text>
  <text x="485" y="272" class="mono muted">Lc +37.2</text>
  <text x="570" y="272" class="mono muted">AA >=4.5</text>
  <text x="655" y="272" class="mono bold green">PASS (AA)</text>

  <!-- Dark theme -->
  <text x="24" y="308" class="mono bold cyan">Theme: dark</text>

  <rect x="36" y="320" width="28" height="19" rx="3" fill="#0a0a0a" stroke="#30363d" />
  <text x="50" y="334" text-anchor="middle" class="mono bold" fill="#e8dec5">Aa</text>
  <text x="76" y="334" class="mono fg">color.text on color.surface</text>
  <text x="410" y="334" class="mono fg">14.79:1</text>
  <text x="485" y="334" class="mono muted">Lc -86.8</text>
  <text x="570" y="334" class="mono muted">AA >=4.5</text>
  <text x="655" y="334" class="mono bold green">PASS (AAA)</text>

  <rect x="36" y="346" width="28" height="19" rx="3" fill="#0a0a0a" stroke="#30363d" />
  <text x="50" y="360" text-anchor="middle" class="mono bold" fill="#ff5a5a">Aa</text>
  <text x="76" y="360" class="mono fg">color.signal-ink on color.surface</text>
  <text x="410" y="360" class="mono fg">6.47:1</text>
  <text x="485" y="360" class="mono muted">Lc -45.2</text>
  <text x="570" y="360" class="mono muted">AA >=4.5</text>
  <text x="655" y="360" class="mono bold green">PASS (AA)</text>

  <rect x="36" y="372" width="28" height="19" rx="3" fill="#ff3838" stroke="#30363d" />
  <text x="50" y="386" text-anchor="middle" class="mono bold" fill="#0a0a0a">Aa</text>
  <text x="76" y="386" class="mono fg">color.text-on-signal on color.surface-signal</text>
  <text x="410" y="386" class="mono fg">5.54:1</text>
  <text x="485" y="386" class="mono muted">Lc +42.3</text>
  <text x="570" y="386" class="mono muted">AA >=4.5</text>
  <text x="655" y="386" class="mono bold green">PASS (AA)</text>
</svg>
