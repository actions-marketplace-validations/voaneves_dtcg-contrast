name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run example
      - run: node ./bin/dtcg-contrast.mjs check "#0a0a0a" "#f4ead4" --no-color
      - run: node -e "import('./src/index.mjs').then(m => { if (!m.evaluatePairs || !m.planFixes || !m.formatSarif) process.exit(1); })"
      - run: npm pack --dry-run

  action-dogfood:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run local composite GitHub Action
        id: contrast
        uses: ./
        with:
          config: examples/voaneves-brand/dtcg-contrast.config.json
          html-report: contrast-matrix.html
          sarif-report: contrast.sarif
      - name: Verify action outputs
        run: |
          test "${{ steps.contrast.outputs.total }}" = "16"
          test "${{ steps.contrast.outputs.passed }}" = "16"
          test "${{ steps.contrast.outputs.failed }}" = "0"
          test -f contrast-matrix.html
          test -f contrast.sarif
