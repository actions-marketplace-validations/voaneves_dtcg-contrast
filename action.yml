name: 'DTCG Contrast Gate'
description: 'Zero-dependency WCAG 2.2 & APCA contrast gate and OKLCH auto-fixer for W3C DTCG 2025.10 design tokens.'
author: 'Victor Neves (voaneves)'
branding:
  icon: 'eye'
  color: 'red'

inputs:
  config:
    description: 'Path to dtcg-contrast.config.json'
    required: false
    default: ''
  tokens:
    description: 'Space-separated paths to DTCG token files or directories (zero-config mode)'
    required: false
    default: ''
  level:
    description: 'Default WCAG conformance threshold (AA, AA-large, AAA, AAA-large, UI)'
    required: false
    default: ''
  min-apca:
    description: 'Minimum APCA |Lc| score (e.g. 60)'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the workflow step when any contrast pair fails'
    required: false
    default: 'true'
  html-report:
    description: 'Optional output path for self-contained HTML contrast matrix report'
    required: false
    default: ''
  summary:
    description: 'Write Markdown contrast report to GitHub Job Summary'
    required: false
    default: 'true'

outputs:
  total:
    description: 'Total token pairs evaluated'
    value: ${{ steps.audit.outputs.total }}
  passed:
    description: 'Number of passing token pairs'
    value: ${{ steps.audit.outputs.passed }}
  failed:
    description: 'Number of failing token pairs'
    value: ${{ steps.audit.outputs.failed }}

runs:
  using: 'composite'
  steps:
    - name: Run dtcg-contrast audit
      id: audit
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TOKENS: ${{ inputs.tokens }}
        INPUT_LEVEL: ${{ inputs.level }}
        INPUT_MIN_APCA: ${{ inputs.min-apca }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_HTML_REPORT: ${{ inputs.html-report }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "$INPUT_TOKENS" ]; then
          for p in $INPUT_TOKENS; do
            ARGS+=("$p")
          done
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_LEVEL" ]; then
          ARGS+=(--level "$INPUT_LEVEL")
        fi
        if [ -n "$INPUT_MIN_APCA" ]; then
          ARGS+=(--min-apca "$INPUT_MIN_APCA")
        fi

        JSON_FILE="${RUNNER_TEMP:-/tmp}/dtcg-contrast-report.json"
        node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format json --output "$JSON_FILE" >/dev/null

        TOTAL=$(node -e "const r=require('$JSON_FILE'); console.log(r.summary.total)")
        PASSED=$(node -e "const r=require('$JSON_FILE'); console.log(r.summary.passed)")
        FAILED=$(node -e "const r=require('$JSON_FILE'); console.log(r.summary.failed)")

        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
        echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format markdown >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -n "$INPUT_HTML_REPORT" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format html --output "$INPUT_HTML_REPORT"
        fi

        if [ "$INPUT_FAIL_ON_ERROR" = "true" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --format pretty
        else
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format pretty
        fi
