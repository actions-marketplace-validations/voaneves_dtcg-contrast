name: 'DTCG Contrast Gate'
description: 'Zero-dependency WCAG 2.2 & APCA contrast gate and OKLCH auto-fixer for W3C DTCG 2025.10 design tokens.'
author: 'Victor Neves (voaneves)'
branding:
  icon: 'eye'
  color: 'red'

inputs:
  config:
    description: 'Path to dtcg-contrast.config.json'
    required: false
    default: ''
  tokens:
    description: 'Space-separated paths to DTCG token files or directories (zero-config mode)'
    required: false
    default: ''
  modes:
    description: 'Space-separated name:extensionPath themes (e.g. "dark:vn.dark")'
    required: false
    default: ''
  level:
    description: 'Default WCAG conformance threshold (AA, AA-large, AAA, AAA-large, UI)'
    required: false
    default: ''
  min-apca:
    description: 'Minimum APCA |Lc| score (e.g. 60)'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the workflow step when any contrast pair fails'
    required: false
    default: 'true'
  html-report:
    description: 'Optional output path for self-contained HTML contrast matrix report'
    required: false
    default: ''
  sarif-report:
    description: 'Optional output path for SARIF 2.1.0 report (GitHub Code Scanning)'
    required: false
    default: ''
  summary:
    description: 'Write Markdown contrast report to GitHub Job Summary'
    required: false
    default: 'true'
  comment-pr:
    description: 'Post or update a sticky contrast report comment on pull requests'
    required: false
    default: 'false'
  token:
    description: 'GitHub token used when comment-pr is true'
    required: false
    default: ${{ github.token }}

outputs:
  total:
    description: 'Total token pairs evaluated'
    value: ${{ steps.audit.outputs.total }}
  passed:
    description: 'Number of passing token pairs'
    value: ${{ steps.audit.outputs.passed }}
  failed:
    description: 'Number of failing token pairs'
    value: ${{ steps.audit.outputs.failed }}

runs:
  using: 'composite'
  steps:
    - name: Run dtcg-contrast audit
      id: audit
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TOKENS: ${{ inputs.tokens }}
        INPUT_MODES: ${{ inputs.modes }}
        INPUT_LEVEL: ${{ inputs.level }}
        INPUT_MIN_APCA: ${{ inputs.min-apca }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_HTML_REPORT: ${{ inputs.html-report }}
        INPUT_SARIF_REPORT: ${{ inputs.sarif-report }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_COMMENT_PR: ${{ inputs.comment-pr }}
        INPUT_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "$INPUT_TOKENS" ]; then
          for p in $INPUT_TOKENS; do
            ARGS+=("$p")
          done
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_MODES" ]; then
          for m in $INPUT_MODES; do
            ARGS+=(--mode "$m")
          done
        fi
        if [ -n "$INPUT_LEVEL" ]; then
          ARGS+=(--level "$INPUT_LEVEL")
        fi
        if [ -n "$INPUT_MIN_APCA" ]; then
          ARGS+=(--min-apca "$INPUT_MIN_APCA")
        fi

        JSON_FILE="${RUNNER_TEMP:-/tmp}/dtcg-contrast-report.json"
        MD_FILE="${RUNNER_TEMP:-/tmp}/dtcg-contrast-report.md"
        node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format json --output "$JSON_FILE" >/dev/null

        read -r TOTAL PASSED FAILED < <(node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(r.summary.total, r.summary.passed, r.summary.failed)" "$JSON_FILE")

        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
        echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

        if [ "$INPUT_SUMMARY" = "true" ] || [ "$INPUT_COMMENT_PR" = "true" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format markdown --output "$MD_FILE" >/dev/null
        fi

        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$INPUT_COMMENT_PR" = "true" ] && { [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; }; then
          node -e '
            const fs = require("node:fs");
            (async () => {
              const token = process.env.INPUT_TOKEN;
              const eventPath = process.env.GITHUB_EVENT_PATH;
              const repo = process.env.GITHUB_REPOSITORY;
              if (!token || !eventPath || !repo) return;
              const ev = JSON.parse(fs.readFileSync(eventPath, "utf8"));
              const pr = ev.pull_request?.number;
              if (!pr) return;
              const marker = "<!-- dtcg-contrast -->";
              const body = `${marker}\n${fs.readFileSync(process.argv[1], "utf8")}`;
              const api = (process.env.GITHUB_API_URL || "https://api.github.com").replace(/\/$/, "");
              const headers = {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "dtcg-contrast-action",
              };
              const listRes = await fetch(`${api}/repos/${repo}/issues/${pr}/comments?per_page=100`, { headers });
              if (!listRes.ok) {
                console.log(`::notice::Skipping PR comment (GitHub API HTTP ${listRes.status})`);
                return;
              }
              const comments = await listRes.json();
              const existing = Array.isArray(comments) ? comments.find((c) => c.body?.includes(marker)) : null;
              const url = existing
                ? `${api}/repos/${repo}/issues/comments/${existing.id}`
                : `${api}/repos/${repo}/issues/${pr}/comments`;
              const writeRes = await fetch(url, {
                method: existing ? "PATCH" : "POST",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({ body }),
              });
              if (!writeRes.ok) {
                console.log(`::notice::Could not post PR comment (GitHub API HTTP ${writeRes.status})`);
              }
            })().catch((err) => console.log(`::notice::PR comment skipped: ${err.message}`));
          ' "$MD_FILE"
        fi

        if [ -n "$INPUT_HTML_REPORT" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format html --output "$INPUT_HTML_REPORT"
        fi

        if [ -n "$INPUT_SARIF_REPORT" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format sarif --output "$INPUT_SARIF_REPORT"
        fi

        if [ "$INPUT_FAIL_ON_ERROR" = "true" ]; then
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --format pretty
        else
          node "$ACTION_PATH/bin/dtcg-contrast.mjs" "${ARGS[@]}" --no-fail --format pretty
        fi
